# ============================================================
#  数据源配置文件 - 用户可自由添加/修改/禁用
# ============================================================
#
#  每个来源支持的字段：
#    name        : 来源显示名称（必填）
#    type        : rss | api_guardian | api_nyt | api_arxiv | wiki | custom_rss
#    enabled     : true/false，快速开关
#    language    : 该来源对应的语言（ISO 639-1）
#    domains     : 该来源涵盖的领域列表
#    url / feeds : RSS 地址或 API 端点
#    api_key     : 需要鉴权的来源填写（可用环境变量 ${VAR_NAME}）
#    extra       : 来源专属附加参数
#
# ============================================================

sources:

  # ── 英文新闻 ──────────────────────────────────────────────

  - name: "The Guardian"
    type: "api_guardian"
    enabled: true
    language: "en"
    domains: [politics, technology, science, culture, health, finance]
    api_key: "739a9de4-de98-4b8d-9cf6-4a0d2fdc07f5"   # 免费注册: https://open-platform.theguardian.com/
    extra:
      page_size: 50

  - name: "Reuters RSS"
    type: "rss"
    enabled: true
    language: "en"
    domains: [politics, finance, technology]
    feeds:
      - url: "https://feeds.reuters.com/reuters/topNews"
        domain_hint: politics
      - url: "https://feeds.reuters.com/reuters/businessNews"
        domain_hint: finance
      - url: "https://feeds.reuters.com/reuters/technologyNews"
        domain_hint: technology

  - name: "BBC News (EN)"
    type: "rss"
    enabled: true
    language: "en"
    domains: [politics, technology, science, culture, health]
    feeds:
      - url: "https://feeds.bbci.co.uk/news/rss.xml"
        domain_hint: politics
      - url: "https://feeds.bbci.co.uk/news/technology/rss.xml"
        domain_hint: technology
      - url: "https://feeds.bbci.co.uk/news/science_and_environment/rss.xml"
        domain_hint: science
      - url: "https://feeds.bbci.co.uk/news/health/rss.xml"
        domain_hint: health

  - name: "arXiv (CS + Physics)"
    type: "api_arxiv"
    enabled: true
    language: "en"
    domains: [science, technology]
    extra:
      categories: ["cs.AI", "cs.CL", "physics.gen-ph"]
      max_results: 50

  # ── 中文新闻 ──────────────────────────────────────────────

  - name: "BBC 中文"
    type: "rss"
    enabled: true
    language: "zh"
